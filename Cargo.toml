[package]
name = "vortcoin-cli"
version = "1.3.69"
edition = "2024"
authors = ["VORTCOIN Core Founders"]
description = "VORTCOIN Network CLI - Hard-Sound Scarcity x Monolithic Speed x RWA Assetization Platform"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2.1"
rand = "0.8"
tiny-bip39 = "=1.0.0" 
pbkdf2 = "0.12"
hmac = "0.12"
sled = "0.34"
wasmi = "0.31"
warp = "0.3"
md5 = "0.8.1"

